# context configuration

[embedding]
# Default embedder uses DeepInfra's OpenAI-compatible endpoint.
url = "https://api.deepinfra.com/v1/openai"
model = "Qwen/Qwen3-Embedding-0.6B"
tokenizer = "hf:Qwen/Qwen3-Embedding-0.6B"
dialect = "deepinfra"
timeout_seconds = 10
embedding_dim = 1024
context_length = 32768
max_batch_size = 15
requests_per_minute = 1000
max_concurrent_requests = 300
tokens_per_minute = 1000000

[reranker]
url = "https://api.deepinfra.com/v1"
model = "Qwen/Qwen3-Reranker-0.6B"
dialect = "deepinfra"
timeout_seconds = 10
# instruction = ""

[chunking]
max_chunk_size = 800
overlap = 0.2
max_parallel = 8
max_file_size = 5242880
large_file_threads = 2

[history]
depth = 10240
commit_size_limit_ratio = 1.0
multi_parents = false
issue_regex = "(#\\d+)"
# commit_exclude_regex = ""
# author_exclude_regex = ""
# path_specs = ""

# Project definitions live under [projects.<name>].
# Example:
# [projects.example]
# repo = "/path/to/repo"
# # data_dir = "/path/to/data"
# # database = "context.duckdb"

[search]
limit = 10
min_score = 0.4
hybrid_weight = 0.6
# path_prefixes = ["src/"]
# file_exts = ["rs"]
# decompose = false
rerank = true
rerank_min_score = 0.4

[prompt]
# tokenizer = "" # defaults to embedding tokenizer
