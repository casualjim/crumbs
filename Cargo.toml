[package]
name = "context"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
confique = { version = "0.4.0", features = ["toml", "json5", "yaml"] }
cupido = "0.3.5"
dirs = "6"
duckdb = "1"
eyre = "0.6"
futures = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntastica-queries = "0.6.1"
text-chunking = { version = "0.1.3", registry = "forgejo" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
toml_edit = "0.22"
tracing = "0.1"
tree-sitter = "0.25"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
